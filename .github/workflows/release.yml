name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run make -- --publish never

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  notify-distributor:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify distributor of new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --json assets --jq '[.assets[] | {name: .name, url: .url}]')
          PAYLOAD=$(jq -n \
            --arg version "${{ github.event.release.tag_name }}" \
            --arg notes "${{ github.event.release.body }}" \
            --arg publishedAt "${{ github.event.release.published_at }}" \
            --argjson assets "$ASSETS" \
            '{version: $version, notes: $notes, publishedAt: $publishedAt, assets: $assets}')
          curl -sf -X POST "${{ secrets.DISTRIBUTOR_API_URL }}/releases" \
            -H "Authorization: ReleaseKey ${{ secrets.DISTRIBUTOR_RELEASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
