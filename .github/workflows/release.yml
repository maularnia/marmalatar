name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  guard-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Ensure release is newer than the latest published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

          LATEST_TAG=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' || true)

          if [ -z "$LATEST_TAG" ]; then
            echo "No prior published release found; allowing first release ($PKG_VERSION)."
            exit 0
          fi

          LATEST_VERSION="${LATEST_TAG#v}"
          echo "Latest published release: $LATEST_VERSION. This release: $PKG_VERSION."

          node -e "
            const parse = (v) => v.split('.').map(Number);
            const [na, nb, nc] = parse(process.argv[1]);
            const [la, lb, lc] = parse(process.argv[2]);
            const newer = na > la || (na === la && nb > lb) || (na === la && nb === lb && nc > lc);
            if (!newer) {
              console.error(\`Release version \${process.argv[1]} is not newer than latest published \${process.argv[2]} -- refusing to publish out of order.\`);
              process.exit(1);
            }
          " "$PKG_VERSION" "$LATEST_VERSION"

  build:
    needs: guard-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run make -- --${{ matrix.platform }} --publish never

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  notify-distributor:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify distributor of new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --json assets --jq '[.assets[] | {name: .name, url: .url}]')
          PAYLOAD=$(jq -n \
            --arg version "${{ github.event.release.tag_name }}" \
            --arg notes "${{ github.event.release.body }}" \
            --arg publishedAt "${{ github.event.release.published_at }}" \
            --argjson assets "$ASSETS" \
            '{version: $version, notes: $notes, publishedAt: $publishedAt, assets: $assets}')
          curl -sf -X POST "${{ secrets.DISTRIBUTOR_API_URL }}/releases" \
            -H "Authorization: ReleaseKey ${{ secrets.DISTRIBUTOR_RELEASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
