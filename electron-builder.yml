appId: com.marmalatar.app
productName: Marmalatar
directories:
  buildResources: build
  output: release
files:
  - out/**
  - node_modules/**
  - package.json
extraResources:
  - from: node_modules/ffmpeg-static
    to: ffmpeg-static
win:
  target: nsis
  icon: electron/assets/icon.ico
linux:
  target:
    - AppImage
    - deb
  icon: electron/assets/icon-256.png
  maintainer: Maularnia <mauliarnia.by@gmail.com>
publish:
  provider: github
  owner: maularnia
  repo: marmalatar
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
