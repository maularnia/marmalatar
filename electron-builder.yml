appId: com.marmalatar.app
productName: Marmalatar
directories:
  buildResources: build
  output: release
files:
  - out/**
  - node_modules/**
  # Every platform's ffprobe binary, 300+ MB. extraResources below copies the one that's needed.
  - '!node_modules/ffprobe-static/**'
  - package.json
extraResources:
  - from: node_modules/ffmpeg-static
    to: ffmpeg-static
win:
  target: nsis
  icon: electron/assets/icon.ico
  extraResources:
    - from: node_modules/ffprobe-static/bin/win32/x64
      to: ffprobe-static
linux:
  target:
    - AppImage
    - deb
    - pacman
    - rpm
  icon: electron/assets/icon-256.png
  extraResources:
    - from: node_modules/ffprobe-static/bin/linux/x64
      to: ffprobe-static
  maintainer: Maularnia <mauliarnia.by@gmail.com>
  category: TextEditor
  syncDesktopName: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# No update feed: without this, electron-builder infers one from the git remote and ships an
# app-update.yml that nothing reads anymore
publish: null
